# Fenestra SDDM - virtual keyboard and network indicator on the Wayland greeter.
# Read after kde_settings.conf (alphabetical order), so these values take precedence.
[General]
InputMethod=qtvirtualkeyboard
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell,QT_IM_MODULE=qtvirtualkeyboard,QML_XHR_ALLOW_FILE_READ=1

[Wayland]
CompositorCommand=kwin_wayland --no-global-shortcuts --no-lockscreen --locale1
