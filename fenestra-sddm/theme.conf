[General]

## PIN mode
# "on": only digits can be typed, and the session opens automatically
# after PinSize digits, without pressing Enter. "off" by default.
PinMode="off"

# Number of digits in PIN mode, from 1 to 10. "4" by default.
PinSize="4"

## Background
# Image shown behind the login screen.
# With the optional random background service (see install.sh), default.jpg is
# replaced by a random image from Backgrounds/ at every boot.
background=Backgrounds/default.jpg

